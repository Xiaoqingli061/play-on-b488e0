/* Short, action-specific motion; the game state always updates immediately. */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s,box-shadow .18s}
button:active{transform:scale(.955)}
.btn .arrow,.scene .go,.nav b{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
button:focus-visible .arrow,button:focus-visible .go{transform:translate(3px,-3px)}
.toggle i{transition:transform .22s cubic-bezier(.2,.8,.2,1);margin-left:0!important}
.toggle.on i{transform:translateX(14px)}
.favorite[aria-pressed="true"]{color:var(--purple)}
.motion-layer{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden;contain:strict}

.motion-ring{position:absolute;width:42px;height:42px;border:2px solid #7553f659;border-radius:50%;box-sizing:border-box}
.motion-confetti{position:absolute;width:8px;height:13px;border-radius:3px}
.motion-score{position:absolute;background:var(--ink);color:var(--lime);padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px #24233118}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
 .btn:hover{transform:translateY(-2px);box-shadow:0 7px 16px #24233112}
 .btn:hover .arrow,.scene:hover .go{transform:translate(3px,-3px)}
 .scene:hover{transform:translateY(-3px)}
 .choice:hover{transform:translateY(-4px) rotate(-1deg)}
}
@media(prefers-reduced-motion:reduce){html:focus-within{scroll-behavior:auto}.motion-layer{display:none}button:active{transform:none}}

.btn:active,.scene:active,.choice:active{transform:scale(.955)}

/* Between-turn scoreboard, keeping the same paper, purple and lime palette. */
.round-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 2px}

.round-spotlight .eyebrow{font-size:9px;letter-spacing:1.25px;color:#ded4ff}
.round-achievement{font-size:12px;color:var(--lime);margin:18px 0 9px}
.round-player{position:relative;z-index:1;font-size:29px;font-weight:800;display:flex;align-items:center;flex-wrap:wrap;gap:10px;overflow-wrap:anywhere;line-height:1.4}

.round-spotlight p{font-size:11px;line-height:1.8;color:#eee7ff;margin:12px 0 0}
.round-spotlight.skipped{background:#e9e2ff;color:var(--ink)}
.round-spotlight.skipped .eyebrow,.round-spotlight.skipped p{color:#726482}
.round-spotlight.skipped .round-achievement{color:var(--purple)}
.round-spotlight.skipped::after{color:#7553f612}
.round-heading{margin-bottom:14px}
.round-title{font-size:22px;margin:0;letter-spacing:-.5px}
.live-board{background:white;border:1px solid var(--line);border-radius:22px;padding:6px 12px}
.rank-list{list-style:none;padding:0;margin:0}
.live-rank{display:flex;align-items:center;gap:11px;padding:17px 10px;border-bottom:1px solid var(--line);animation:ranking-in .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--rank-order)*35ms)}
.live-rank:last-child{border-bottom:0}
.live-rank.just-played{background:#dcfa7a38;border-radius:16px;margin:5px 0;border-bottom-color:transparent}
.rank-medal{flex:0 0 32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:800;background:#f3f1f6;color:#817b8a}
.rank-medal.place-1{background:var(--purple);color:white;transform:rotate(-5deg)}
.rank-medal.place-2{background:var(--lavender);color:var(--purple)}
.rank-medal.place-3{background:var(--lime);color:#495826}
.rank-details{flex:1;min-width:0}
.rank-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.round-tag{font-size:9px;font-weight:500;border:1px solid #a1b65388;padding:2px 5px;border-radius:5px;white-space:nowrap}
.rank-meta{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin:7px 0}
.rank-movement{white-space:nowrap}
.rank-movement.up{color:#637c29;font-weight:700}
.rank-movement.down{color:#918799}
.rank-track{height:4px;border-radius:4px;background:#f0edf5;overflow:hidden}
.rank-track i{display:block;height:100%;width:var(--score-width);border-radius:inherit;background:#c4b2ff;transform-origin:left;animation:rank-grow .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--rank-order)*35ms + 100ms)}
.just-played .rank-track i{background:var(--purple)}
.rank-score{text-align:right;flex:0 0 37px}
.rank-score strong{font-size:23px;display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.rank-score small{font-size:9px;color:var(--muted)}
.ranking-note{font-size:10px;color:var(--muted);line-height:1.9;text-align:center;margin:17px 0 20px}
.handoff{background:#eeebe5;border-radius:17px;padding:15px 17px;display:flex;align-items:center;gap:13px;margin:0 0 14px}
.handoff>span{font-size:25px;color:var(--purple)}
.handoff div{min-width:0}
.handoff small{display:block;font-size:10px;color:var(--muted);line-height:1.8}
.handoff strong{display:block;font-size:14px;line-height:1.8;overflow-wrap:anywhere}
@keyframes ranking-in{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}

 <p class="ranking-note">完成 +1 · 跳过不扣分 · 同分并列<br>每 ${E.rankingInterval(game)} 回合查看排名，最后一轮必看。<br>名次变化以上次榜单为准。</p>
 ${game.finished?'<div class="handoff"><span>✳</span><div><strong>今晚，你们都很闪耀。</strong><small>全部回合结束，收好这份共同回忆。</small></div></div>':`<div class="handoff"><span>↗</span><div><small>下一位，聚光灯交给</small><strong>${esc(next.name)}</strong></div></div>`}
 <button class="btn" data-action="next-round">${game.finished?'查看本场总结':'下一位，继续开玩'} <span class="arrow">↗</span></button>`;
}
function resultView(){if(!game)return '';const r={players:E.standings(game)};return `${header('今晚的快乐回忆')}<section class="result-hero"><div class="eyebrow">GOOD TIMES, GREAT PEOPLE.</div><div class="trophy">✳</div><h1>今晚，你们都很闪耀。</h1><p class="subtitle">${game.players.length} 位玩家 · ${game.turn} 回合 · 又多了一份共同回忆</p></section><section class="panel"><div class="label">勇气小榜单 <span class="tag">完成一题 +1</span></div>${r.players.map((p,i)=>`<div class="ranking"><span class="rank">${p.rank}</span><div>${esc(p.name)}<small>${p.tied?'同分并列 · ':''}完成 ${p.score} 次 · 自由跳过 ${p.passed} 次</small></div><span class="score">${p.score}<small>勇气值</small></span></div>`).join('')}</section><p class="result-note">名次只是小彩蛋，愿意参与就是满分。<br>谢谢每一个认真倾听、尊重彼此的你。</p><button class="btn" data-action="again">再玩一场 ↻</button><button class="btn secondary" style="margin-top:12px" data-action="share">复制今晚的回忆 ↗</button>`}
function formatTime(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}
function modal(html){previousFocus=document.activeElement;$('#overlay').innerHTML=`<div class="scrim"><section class="modal" role="dialog" aria-modal="true" aria-label="${html.includes('新增')?'新增题目':'提示'}">${html}</section></div>`;PlayMotion.openModal();setTimeout(()=>$('#overlay').querySelector('input,button,textarea,select')?.focus(),0)}
function closeModal(){$('#overlay').innerHTML='';previousFocus?.focus()}
function finish(completed){
 if(page!=='game'||!game?.current||game.finished)return;
 const actor={...game.players[game.player]};
 stopClock();if(!E.settle(game,completed))return;
 seconds=60;feedback();
 if(game.finished){store.history.unshift(E.result(game));store.history=store.history.slice(0,30);save()}
 if(E.shouldShowRanking(game)){
  roundSummary={actor,completed,players:E.standings(game,rankingBaseline)};rankingBaseline=roundSummary.players;
  go('round');$('.round-title')?.focus({preventScroll:true});
 }else go('game');
}
const actions={
nav:v=>{if(v==='library'){filter.favorites=false;filter.q='';limit=30}go(v)},back:v=>go(v),start:()=>go('setup'),'choose-scene':v=>{setup.scene=v;go('setup')},'all-scenes':()=>modal(`<h2>每种相聚，都有玩法。</h2><p>选一个适合今晚的场景。</p><div class="scene-grid">${D.scenes.map(sceneCard).join('')}</div><button class="btn secondary" style="margin-top:18px" data-action="close">下次再选</button>`),
'rules':()=>modal('<h2>好玩，先从舒服开始。</h2><p>1. 添加 2–12 位玩家，选择场景、强度和回合。<br>2. 轮到谁，由谁选择真心话或大冒险，也可以随机。<br>3. 完成一题获得 1 点勇气值；换题不计回合，跳过不扣分。<br>4. 每次结束随机交棒给其他玩家。题池抽完后会重新洗牌。<br>5. 任何人都可以跳过。涉及他人参与，必须先获得同意；不公开隐私，不强迫身体接触。</p><button class="btn" data-action="close">约定好了，放开玩</button>'),
close:closeModal,daily:()=>modal('<span class="tag">每日一问</span><h2 style="margin-top:20px">最近哪件小事，让你觉得生活很可爱？</h2><p>不用想一个精彩的答案。一次日落，一顿好饭，一个刚刚好的拥抱，都算数。</p><button class="btn" data-action="close">把这个问题带给朋友 ♡</button>'),
'remove-player':v=>{setup.players.splice(+v,1);render()},level:v=>{setup.level=+v;render()},rounds:v=>{setup.rounds=+v;render()},begin:()=>{try{roundSummary=null;game=E.create(setup.players,setup.scene,setup.level,setup.rounds);E.randomPlayer(game);rankingBaseline=E.standings(game);seconds=60;go('game');feedback()}catch(e){toast(e.message)}},
draw:v=>{if(page!=='game')return;try{E.draw(game,store,v==='random'?(Math.random()<.5?'truth':'dare'):v);seconds=60;render();feedback()}catch(e){toast(e.message)}},replace:()=>{stopClock();try{E.draw(game,store,game.current.type,true);seconds=60;render();feedback()}catch(e){toast(e.message)}},complete:()=>finish(true),skip:()=>finish(false),'next-round':()=>{if(page==='round')go(game.finished?'result':'game')},'random-player':()=>{E.randomPlayer(game);render();feedback()},
favorite:v=>{store.favorites=store.favorites.includes(v)?store.favorites.filter(id=>id!==v):store.favorites.concat(v);save();if(page==='game'){const b=$('.favorite'),saved=store.favorites.includes(v);b.textContent=saved?'♥':'♡';b.setAttribute('aria-label',saved?'取消收藏':'收藏题目');b.setAttribute('aria-pressed',String(saved))}else render()},
'timer':()=>{if(clock){stopClock();$('#timer-state').textContent='继续计时';return}if(seconds===0)seconds=60;$('#timer-state').textContent='暂停';clock=setInterval(()=>{seconds--;const t=$('#timer');if(t)t.textContent=formatTime(seconds);if(seconds<=0){stopClock();$('#timer-state').textContent='重新计时';feedback();toast('时间到啦，慢慢来，也可以继续分享')}},1000)},'timer-reset':()=>{stopClock();seconds=60;render()},
'exit-game':()=>{stopClock();modal('<h2>先休息一下？</h2><p>本场还没有结束。返回首页会结束这一场，未完成的结果不会计入相聚记录。</p><div class="row"><button class="btn secondary" data-action="close">继续玩</button><button class="btn" data-action="confirm-exit">返回首页</button></div>')},'confirm-exit':()=>{closeModal();game=null;go('home')},
'filter-fav':v=>{filter.favorites=v==='fav';limit=30;render()},load:()=>{limit+=30;render()},'show-favorites':()=>{filter={scene:'all',type:'',q:'',favorites:true};limit=30;go('library')},setting:v=>{store.settings[v]=!store.settings[v];save();render()},
'add-card':()=>modal(`<h2>写一道你的独家题。</h2><p>好问题，让彼此更靠近。</p><form id="card-form"><label for="card-text">题目内容</label><textarea id="card-text" required maxlength="120" placeholder="例如：你最想和朋友一起实现的小愿望是什么？"></textarea><div class="row"><div><label for="card-type">类型</label><select id="card-type"><option value="truth">真心话</option><option value="dare">大冒险</option></select></div><div><label for="card-scene">场景</label><select id="card-scene">${D.scenes.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div></div><label for="card-level">强度</label><select id="card-level"><option value="1">轻松破冰</option><option value="2">走心一点</option><option value="3">深度了解</option></select><div class="row"><button type="button" class="btn secondary" data-action="close">取消</button><button class="btn" type="submit">存进题库</button></div></form>`),
history:()=>modal(`<h2>相聚记录</h2><p>仅保留当前设备最近 30 场。</p>${store.history.map(h=>`<div class="history-row">${esc(scene(h.scene).name)} · ${h.rounds} 回合 · ${h.players.length} 人<small>${new Date(h.date).toLocaleString('zh-CN')}<br>${h.players.map(p=>esc(p.name)+' '+p.score+'分').join(' · ')}</small></div>`).join('')||'<p>还没有记录。和朋友开一局吧！</p>'}<button class="btn secondary" style="margin-top:20px" data-action="close">返回</button>`),again:()=>go('setup'),share:async()=>{const text=`放开玩 · 今晚的快乐回忆\n${game.players.length} 位玩家一起完成了 ${game.turn} 回合。\n${E.result(game).players.map(p=>p.name+'：'+p.score+' 点勇气值').join('\n')}\n没有标准答案，开心就是满分。`;try{await navigator.clipboard.writeText(text);toast('回忆已复制，去分享给朋友吧')}catch{modal(`<h2>今晚的快乐回忆</h2><p>长按下方文字即可选择复制。</p><textarea aria-label="可复制的回忆文字" readonly>${esc(text)}</textarea><button class="btn" style="margin-top:18px" data-action="close">收好回忆</button>`)}}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 const key=b.dataset.action,value=b.dataset.value;
 PlayMotion.press(e,b);
 if(!key)return;
 const outgoing=['replace','complete','skip'].includes(key)?PlayMotion.captureCard():null;
 if($('#overlay').children.length&&key==='choose-scene')closeModal();
 actions[key]?.(value);
 PlayMotion.afterAction(key,value,b,outgoing);
});
document.addEventListener('submit',e=>{if(e.target.id==='player-form'){e.preventDefault();const n=E.clean($('#player-name').value,12);if(!n)return toast('先写下朋友的昵称');if(setup.players.length>=12)return toast('最多 12 位玩家');if(setup.players.includes(n))return toast('这个昵称已经有人用啦');setup.players.push(n);render();$('#player-name').focus()}if(e.target.id==='card-form'){e.preventDefault();const text=E.clean($('#card-text').value);if(!text)return toast('题目内容不能为空');if(E.all(store).some(c=>c.text===text))return toast('这道题已经在题库里啦');store.custom.push({id:'custom-'+store.custom.length,text,type:$('#card-type').value,scene:$('#card-scene').value,level:+$('#card-level').value});save();closeModal();toast('已存入题库，同场景游戏可抽到');if(page==='library'||page==='profile')render()}});
document.addEventListener('change',e=>{if(e.target.id==='setup-scene'){setup.scene=e.target.value;render()}if(e.target.id==='filter-scene'){filter.scene=e.target.value;limit=30;render()}if(e.target.id==='filter-type'){filter.type=e.target.value;limit=30;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;filter.q=e.target.value;limit=30;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(!$('#overlay').children.length)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...$('#overlay').querySelectorAll('button,input,select,textarea')].filter(n=>!n.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
render();
</script></body></html>
